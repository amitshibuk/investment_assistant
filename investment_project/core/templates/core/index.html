<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Assistant Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap');
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1f2937; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        
        /* NEW: Styles for Markdown content */
        .prose strong { color: #22d3ee; font-weight: 700; } /* Cyan for bold */
        .prose p { margin-bottom: 0.5rem; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 0.5rem; }
    </style>
</head>
<body class="bg-gray-900 text-white flex justify-center h-screen p-2 sm:p-4">

    <div class="w-full max-w-3xl flex flex-col bg-gray-800 rounded-2xl shadow-2xl overflow-hidden h-full">
        <div class="p-4 bg-gray-800 border-b border-gray-700 flex justify-between items-center shadow-md z-10">
            <div>
                <h1 class="text-xl font-bold text-cyan-400">Investment Assistant</h1>
                <p class="text-xs text-gray-400">Powered by Gemini & LSTM</p>
            </div>
            <button onclick="location.reload()" class="text-xs text-gray-500 hover:text-white underline">Clear Chat</button>
        </div>

        <div id="chat-container" class="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-900">
            <div class="flex justify-start">
                <div class="bg-gray-700 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-md">
                    <p>👋 Hi! I'm your AI Investment Assistant.</p>
                </div>
            </div>
        </div>

        <div id="loader" class="hidden p-2 text-center bg-gray-900">
            <div class="inline-flex items-center space-x-2 bg-gray-800 px-4 py-2 rounded-full">
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce"></div>
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce delay-75"></div>
                <div class="w-2 h-2 bg-cyan-400 rounded-full animate-bounce delay-150"></div>
            </div>
        </div>

        <div class="p-4 bg-gray-800 border-t border-gray-700">
            <div id="error-message" class="hidden mb-2 text-center text-red-400 text-xs"></div>
            <form id="query-form" class="flex gap-2 relative">
                <input type="text" id="query-input" placeholder="Ask about a stock..." class="flex-grow p-4 bg-gray-700 text-white rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500 transition placeholder-gray-500" autocomplete="off">
                <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold p-4 rounded-xl transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                    </svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const form = document.getElementById('query-form');
        const input = document.getElementById('query-input');
        const chatContainer = document.getElementById('chat-container');
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            appendMessage('user', query);
            input.value = '';
            errorMessage.classList.add('hidden');
            loader.classList.remove('hidden');
            scrollToBottom();

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Error.');
                
                appendBotResponse(data);
            } catch (err) {
                errorMessage.textContent = err.message;
                errorMessage.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                scrollToBottom();
            }
        });

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
            const bubble = document.createElement('div');
            bubble.className = role === 'user' 
                ? "bg-cyan-600 text-white p-3 rounded-2xl rounded-tr-none max-w-[80%] shadow-md"
                : "bg-gray-700 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[85%] shadow-md prose"; // Added 'prose' class
            
            // Render text content safely
            bubble.textContent = text; 
            div.appendChild(bubble);
            chatContainer.appendChild(div);
        }

        function appendBotResponse(data) {
            const div = document.createElement('div');
            div.className = "flex justify-start w-full";
            
            let contentHtml = `<div class="bg-gray-700 text-gray-200 p-4 rounded-2xl rounded-tl-none max-w-[90%] sm:max-w-[85%] shadow-md overflow-hidden prose">`;
            
            // NEW: Parse Markdown using marked.parse()
            if (data.summary) {
                contentHtml += marked.parse(data.summary);
            }

            if (data.predictions && data.predictions.length > 0) {
                contentHtml += `
                    <div class="mt-4 bg-gray-800 rounded-lg overflow-hidden border border-gray-600">
                        <div class="bg-gray-900 p-2 px-3 border-b border-gray-700 flex justify-between items-center">
                            <span class="text-cyan-400 font-bold text-xs uppercase tracking-wider">${data.company} (${data.ticker})</span>
                            <span class="text-gray-500 text-xs">${data.days_ahead} Day Forecast</span>
                        </div>
                        <div class="max-h-60 overflow-y-auto">
                            <table class="w-full text-sm text-left">
                                <thead class="bg-gray-800 sticky top-0">
                                    <tr class="text-gray-400">
                                        <th class="p-2 pl-3 font-medium">Day</th>
                                        <th class="p-2 pr-3 text-right font-medium">Price (USD)</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-700">
                                    ${data.predictions.map(p => `
                                        <tr class="hover:bg-gray-750 transition-colors">
                                            <td class="p-2 pl-3 text-gray-300">Day ${p.day}</td>
                                            <td class="p-2 pr-3 text-right font-mono text-cyan-300">$${p.predicted_close.toFixed(2)}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            contentHtml += `</div>`;
            div.innerHTML = contentHtml;
            chatContainer.appendChild(div);
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
