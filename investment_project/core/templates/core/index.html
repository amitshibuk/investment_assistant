<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Investment Assistant</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Plotly -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        .prose strong {
            color: #22d3ee;
        }
    </style>
</head>

<body class="bg-gray-900 text-white flex justify-center h-screen p-4">

    <div class="w-full max-w-3xl flex flex-col bg-gray-800 rounded-2xl shadow-2xl h-full overflow-hidden">

        <!-- Header -->
        <div class="p-4 border-b border-gray-700 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="{% url 'landing' %}"
                    class="bg-gray-700 hover:bg-gray-600 text-gray-300 p-2 rounded-lg transition-colors"
                    title="Back to Dashboard">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <h1 class="text-xl font-bold text-cyan-400">Investment Assistant</h1>
            </div>
            <button onclick="location.reload()" class="text-xs text-gray-400 hover:text-white underline">
                Clear
            </button>
        </div>

        <!-- Chat -->
        <div id="chat-container" class="flex-grow overflow-y-auto p-4 space-y-4 bg-gray-900">
            <div class="bg-gray-700 p-4 rounded-2xl w-fit">
                👋 Hi! Ask me about a stock.
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="hidden text-center text-sm text-gray-400 p-2">
            Thinking...
        </div>

        <!-- Input -->
        <form id="query-form" class="p-4 bg-gray-800 border-t border-gray-700 flex gap-2">
            <input id="query-input"
                class="flex-grow p-4 bg-gray-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-cyan-500"
                placeholder="Ask about a stock..." autocomplete="off">
            <button class="bg-cyan-600 hover:bg-cyan-500 px-6 rounded-xl font-bold">
                Send
            </button>
        </form>

    </div>

    <script>
        const form = document.getElementById('query-form');
        const input = document.getElementById('query-input');
        const chatContainer = document.getElementById('chat-container');
        const loader = document.getElementById('loader');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = input.value.trim();
            if (!query) return;

            appendMessage(query, true);
            input.value = '';
            loader.classList.remove('hidden');

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const data = await res.json();
                if (!res.ok) throw new Error(data.error);

                appendBotResponse(data);

            } catch (err) {
                appendMessage("Error: " + err.message, false);
            } finally {
                loader.classList.add('hidden');
                scrollBottom();
            }
        });

        function appendMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ?
                "bg-cyan-600 p-3 rounded-2xl ml-auto w-fit" :
                "bg-gray-700 p-4 rounded-2xl w-fit prose";

            div.textContent = text;
            chatContainer.appendChild(div);
            scrollBottom();
        }

        function appendBotResponse(data) {

            const wrapper = document.createElement('div');
            wrapper.className = "bg-gray-700 p-4 rounded-2xl prose";

            if (data.summary) {
                wrapper.innerHTML = marked.parse(data.summary);
            }

            const chartId = "chart-" + Date.now();

            if (data.chart_data) {
                const chartDiv = document.createElement('div');
                chartDiv.id = chartId;
                chartDiv.style.height = "400px";
                chartDiv.className = "my-4 border border-gray-600 rounded-lg";
                wrapper.appendChild(chartDiv);
            }

            if (data.predictions && data.predictions.length > 0) {
                const table = document.createElement('div');
                table.className = "mt-4 bg-gray-800 rounded-lg border border-gray-600 p-3 text-sm";

                table.innerHTML = `
            <div class="flex justify-between items-center mb-2">
                <div class="flex items-center gap-2">
                    <span class="text-cyan-400 font-bold">${data.company} (${data.ticker})</span>
                    <button onclick="addToPortfolio('${data.ticker}')" class="bg-gray-700 hover:bg-gray-600 text-cyan-400 px-2 py-0.5 rounded text-xs border border-cyan-900 transition-colors" title="Add to Portfolio">
                        + Add
                    </button>
                </div>
                <span class="text-gray-400 text-xs">${data.days_ahead} Day Forecast</span>
            </div>
            <div class="max-h-60 overflow-y-auto">
                ${data.predictions.map(p => `
                    <div class="flex justify-between border-b border-gray-700 py-1">
                        <span>Day ${p.day}</span>
                        <span class="text-cyan-300 font-mono">$${p.predicted_close.toFixed(2)}</span>
                    </div>
                `).join('')}
            </div>
        `;
                wrapper.appendChild(table);
            }

            chatContainer.appendChild(wrapper);

            if (data.chart_data) {
                const chartDiv = document.getElementById(chartId);

                Plotly.purge(chartDiv);
                chartDiv.innerHTML = "";

                Plotly.newPlot(
                    chartDiv,
                    data.chart_data.data,
                    data.chart_data.layout,
                    {
                        responsive: true,
                        displayModeBar: false
                    }
                );
            }

            scrollBottom();
        }

        function scrollBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function addToPortfolio(ticker) {
            try {
                const res = await fetch('/add-portfolio/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ticker: ticker })
                });
                const data = await res.json();
                /* Simple toast or alert */
                if (data.status === 'added') {
                    alert('✅ ' + data.message);
                } else if (data.status === 'exists') {
                    alert('ℹ️ ' + data.message);
                } else {
                    alert('❌ Error: ' + (data.error || 'Unknown error'));
                }
            } catch (err) {
                console.error(err);
                alert('❌ Failed to add to portfolio');
            }
        }
    </script>

</body>

</html>
